name: CI

on:
  push:
    branches: [ master, '**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build ESP-IDF firmware
      working-directory: examples/minimal_body
      run: idf.py build

    - name: Check ESP-IDF Build Artifacts
      working-directory: examples/minimal_body/build
      run: |
        ls -lh minimal_body.elf minimal_body.bin
        size minimal_body.elf

    - name: Install g++ for host test
      run: apt-get update && apt-get install -y g++

    - name: Build Host Test
      run: |
        g++ -std=c++17 -Icomponents/neondoll/include host_test/test_neondoll.cpp components/neondoll/src/neondoll.cpp -o host_test/test_neondoll

    - name: Run Host Test
      run: host_test/test_neondoll