name: CI

on:
  push:
    branches: [ master, '**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git cmake ninja-build gcc g++ \
          flex bison gperf dfututil \
          python3 python3-pip python3-setuptools python3-serial python3-cryptography \
          python3-future python3-pyparsing python3-pyelftools \
          libffi-dev libssl-dev
    - name: Install ESP-IDF
      run: |
        mkdir -p $HOME/esp-idf
        cd $HOME/esp-idf
        git clone --depth 1 --branch v5.2.1 https://github.com/espressif/esp-idf.git .
        git submodule update --init --recursive
        ./install.sh esp32
        echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV
        echo "IDF_TARGET=esp32" >> $GITHUB_ENV
    - name: Set up ESP-IDF environment
      run: |
        . $HOME/esp-idf/export.sh
        echo "IDF_PATH=$IDF_PATH" >> $GITHUB_ENV
        echo "IDF_TARGET=esp32" >> $GITHUB_ENV
    - name: Debug environment
      run: |
        echo "IDF_PATH: $IDF_PATH"
        which idf.py || echo "idf.py not found"
    - name: Check ESP-IDF Build Artifacts
      run: |
        ls -lh examples/minimal_body/build/minimal_body.elf examples/minimal_body/build/minimal_body.bin || echo "Build artifacts not found"
        size examples/minimal_body/build/minimal_body.elf || echo "size failed"
    - name: Install g++ for host test
      run: sudo apt-get update && sudo apt-get install -y g++
    - name: Build Host Test
      run: |
        g++ -std=c++17 -Icomponents/neondoll/include host_test/test_neondoll.cpp components/neondoll/src/neondoll.cpp -o host_test/test_neondoll
    - name: Run Host Test
      run: host_test/test_neondoll