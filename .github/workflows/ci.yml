name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev libsodium-dev cmake ninja-build
      - name: Prepare pinned WireGuard patch and host lwIP
        run: |
          curl -fL https://codeload.github.com/esphome-libs/wireguard/tar.gz/9b7660fed27151abdcbf32b43861044cf4a32497 -o /tmp/wireguard.tar.gz
          python3 patches/esp_wireguard/prepare.py /tmp/wireguard.tar.gz /tmp/wireguard
          curl -fL https://codeload.github.com/lwip-tcpip/lwip/tar.gz/refs/tags/STABLE-2_1_3_RELEASE -o /tmp/lwip.tar.gz
          echo '6add930f7c0c7a8adbe3fef393ecf47ce32ed8dadd00d23042ff61db05b194ef  /tmp/lwip.tar.gz' | sha256sum -c -
          mkdir /tmp/lwip
          tar -xzf /tmp/lwip.tar.gz -C /tmp/lwip --strip-components=1
      - run: cmake -S . -B build/host -G Ninja -DWIREGUARD_SOURCE_DIR=/tmp/wireguard -DLWIP_SOURCE_DIR=/tmp/lwip
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
      - name: Host sanitizers
        run: |
          cmake -S . -B build/sanitized -G Ninja -DWIREGUARD_SOURCE_DIR=/tmp/wireguard -DLWIP_SOURCE_DIR=/tmp/lwip \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build/sanitized
          UBSAN_OPTIONS=halt_on_error=1 ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/sanitized --output-on-failure --timeout 45
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and emulate ESP32 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C examples/minimal_body build
          python integration/qemu_identity.py examples/minimal_body/build
      - name: Build Wi-Fi-enabled example
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C examples/minimal_body -B "$PWD/examples/minimal_body/build/wifi" \
            -D SDKCONFIG="$PWD/examples/minimal_body/build/sdkconfig.wifi" \
            -D SDKCONFIG_DEFAULTS="$PWD/examples/minimal_body/sdkconfig.wifi-ci.defaults" build
      - name: Build patched IPv6 WireGuard compile probe
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          curl -fL https://codeload.github.com/esphome-libs/wireguard/tar.gz/9b7660fed27151abdcbf32b43861044cf4a32497 -o /tmp/wireguard.tar.gz
          python patches/esp_wireguard/prepare.py /tmp/wireguard.tar.gz /tmp/wireguard
          mkdir /tmp/wg-ipv6-probe
          cp -a integration/wireguard_ipv6/esp32/. /tmp/wg-ipv6-probe/
          idf.py -C /tmp/wg-ipv6-probe -B /tmp/wg-ipv6-build -D WIREGUARD_SOURCE_DIR=/tmp/wireguard build
      - name: Build production WireGuard backend
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C examples/minimal_body -B /tmp/wg-backend-build \
            -D SDKCONFIG=/tmp/wg-backend-build/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=$PWD/examples/minimal_body/sdkconfig.wifi-ci.defaults;$PWD/examples/minimal_body/sdkconfig.wireguard.defaults" \
            -D WIREGUARD_SOURCE_DIR=/tmp/wireguard build
      - name: Build opt-in interoperability application (no hardware acceptance)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C integration/wireguard_interop/esp32 -B /tmp/wg-interop-build \
            -D SDKCONFIG=/tmp/wg-interop-build/sdkconfig \
            -D NEONDOLL_WG_INTEROP=ON -D WIREGUARD_SOURCE_DIR=/tmp/wireguard build
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-body-esp32
          path: |
            examples/minimal_body/build/minimal_body.bin
            examples/minimal_body/build/minimal_body.elf
            examples/minimal_body/build/qemu-boot-*.log
            examples/minimal_body/build/wifi/minimal_body.bin
