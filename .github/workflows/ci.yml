name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake ninja-build
      - run: cmake -S . -B build/host -G Ninja
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and emulate ESP32 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C examples/minimal_body build
          python integration/qemu_identity.py examples/minimal_body/build
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-body-esp32
          path: |
            examples/minimal_body/build/minimal_body.bin
            examples/minimal_body/build/minimal_body.elf
            examples/minimal_body/build/qemu-boot-*.log
